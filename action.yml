name: CodeCharter
description: Analyze .NET code quality and annotate pull requests with violations
author: bochmann-software

branding:
  icon: shield
  color: blue

inputs:
  mode:
    description: |
      What this step runs. `analyze` (the default) runs the rule analysis and is
      configured by the inputs below it. `coverage` runs the test-coverage gate
      instead: it executes your test projects with coverage collection and fails
      when line coverage is below the configured minimum. The coverage inputs are
      grouped at the end of this list and are ignored in `analyze` mode.
    required: false
    default: analyze
  solution:
    description: |
      Path to the .sln, .slnx, or .csproj file, relative to the repository root.
      Leave empty to auto-discover: the action picks the first .sln/.slnx it finds
      (shallowest directory first, then alphabetical), or the first .csproj when no
      solution file exists. Set this explicitly when the repository has several.
    required: false
    default: ''
  api-key:
    description: |
      Your CodeCharter portal API key. Generate one at
      https://codecharter.tools/api-keys and store as a
      repository or organization secret named CODECHARTER_API_KEY.
    required: true
  rules:
    description: |
      Path to a local rules directory in your repository (e.g. rules), passed to
      the CLI as `--rules`. Leave empty to let the CLI use its own default: a
      `rules` directory in the repository root if one exists, otherwise the
      sample rules bundled with the CLI.
    required: false
    default: ''
  require-rules:
    description: |
      Fail the run instead of silently falling back to the CLI's bundled sample
      rules. When 'true' and neither `rules` is set nor a `rules/` directory
      exists in the repository root, the step fails with an actionable message.
      Leave 'false' (default) to allow the bundled-rules fallback; a warning is
      logged whenever that fallback is used either way.
    required: false
    default: 'false'
  fail-on:
    description: Exit with a failure when any violation reaches this level (error | warn | info | never).
    required: false
    default: 'error'
  severity-threshold:
    description: Minimum severity to report and annotate (error | warn | info).
    required: false
    default: 'info'
  diff:
    description: |
      Scope the analysis to only changed lines. One input, interpreted by value:
        - 'false' (default) — analyze the whole solution.
        - 'true' — on pull requests, diff against the base branch
          (merge-base..head). Ignored (with a warning) on non-PR events.
        - a git ref range, e.g. 'main..HEAD' or 'origin/main..HEAD'.
        - a path to a unified diff file in the repository.
      In every diff mode both the reported findings and the fail-on gate apply
      only to changed lines. The diff is computed on the runner, so check out
      enough history (actions/checkout with fetch-depth: 0) for the compared
      commits to be reachable.
    required: false
    default: 'false'
  baseline:
    description: |
      Path to a baseline file (relative to the repo root, or absolute) recording
      accepted findings. When set, both the reported findings and the fail-on gate
      apply only to findings NOT in the baseline, so existing findings are tolerated
      and only new ones fail the build. Generate the file with the CLI's
      `--write-baseline` and commit it. A missing file analyzes everything (with a
      warning); a corrupt file fails the run. Composes with `diff`. Requires a CLI
      with baseline support (`version: latest`, the default, satisfies it).
    required: false
    default: ''
  telemetry:
    description: |
      Opt-in telemetry. When 'true', the run sends one anonymous usage event
      (tool name, latency bucket, per-rule finding counts, hashed workspace id) to
      the CodeCharter endpoint, authenticated with the short-lived license the CLI
      already mints from `api-key`. Off by default; no source, file paths, or code
      are ever sent. Requires a CLI with telemetry support (`version: latest`, the
      default, satisfies it).
    required: false
    default: 'false'
  badge:
    description: |
      Opt-in; only with `badge: true` are coverage/finding numbers attached to the
      authenticated check report so the portal can serve repository badges;
      nothing is stored otherwise. The attached numbers are aggregates only
      (coverage percent and line totals, finding counts by severity, test counts)
      plus the branch they were measured on. Valid in both modes; enable the badge
      for the repository in the portal to get the badge URL.
    required: false
    default: 'false'
  version:
    description: |
      CodeCharter CLI version selector. Use 'latest' (recommended), 'v1',
      'v1.4', or an exact pin like 'v1.4.2'.
    required: false
    default: 'latest'
  portal-base-url:
    description: |
      CodeCharter portal base URL. Override only if pointing at a self-hosted
      portal or staging environment.
    required: false
    default: 'https://codecharter.tools'
  comment:
    description: |
      Post (and update) a sticky summary comment on the pull request. Requires
      `permissions: pull-requests: write`. Set to 'false' to rely on inline
      annotations only.
    required: false
    default: 'true'
  cache:
    description: |
      Cache the downloaded CLI binary between runs (via the Actions cache) to
      skip re-downloading it each run. Set to 'false' to always download.
    required: false
    default: 'true'
  comment-key:
    description: |
      Discriminator for the sticky PR comment. Leave empty to derive it from the
      workflow, job, and solution (so multiple CodeCharter steps in one PR each keep
      their own comment). Set an explicit value to control which runs share a
      comment (e.g. a matrix dimension) or to merge several into one.
    required: false
    default: ''
  sarif-output:
    description: |
      If set, additionally write a SARIF v2.1 file to this path (relative to the
      repository root) for upload to GitHub Code Scanning. Leave empty to skip.
    required: false
    default: ''
  github-token:
    description: Token used to post the PR comment. Defaults to the workflow token.
    required: false
    default: ${{ github.token }}

  coverage-root:
    description: |
      Coverage mode only. Directory tree searched for test projects, relative to
      the repository root. Defaults to the repository root.
    required: false
    default: ''
  min-coverage:
    description: |
      Coverage mode only. Minimum required line-coverage percent (0-100), written
      locale-independently (e.g. `99.5`). Overrides `coverage.minimum-percent` in
      `.codecharter/config.yml` for this run; leave empty to use the repo config.
    required: false
    default: ''
  skip-tests:
    description: |
      Coverage mode only. When `true`, do not run the tests; analyze the coverage
      files already present under the results root. Use this when a previous step
      in the same job already ran `dotnet test` with coverage collection.
    required: false
    default: 'false'
  results-root:
    description: |
      Coverage mode only. Directory for test and coverage artifacts, relative to
      the repository root. Defaults to the CLI's own location under the coverage root.
    required: false
    default: ''
  fail-on-threshold:
    description: |
      Coverage mode only. When `false`, coverage below the minimum is reported but
      does not fail the step. Failing tests, missing coverage data and configuration
      errors still fail regardless of this input.
    required: false
    default: 'true'
  coverage-report:
    description: |
      Coverage mode only. Path (relative to the repository root) to write the JSON
      coverage report to, so later steps can upload or post-process it. Leave empty
      to keep the report in a temp directory that is removed when the step ends.
    required: false
    default: ''

outputs:
  coverage-percent:
    description: Line-coverage percent from the coverage run; empty when no coverage data was produced.
  coverage-met:
    description: '"true" when coverage met the required minimum.'
  coverage-uncovered-regions:
    description: Number of uncovered regions in the coverage report.
  coverage-report-path:
    description: Path to the JSON coverage report, if coverage-report was set.
  findings-total:
    description: Total number of findings.
  findings-error:
    description: Number of error-level findings.
  findings-warn:
    description: Number of warning-level findings.
  findings-info:
    description: Number of info-level findings.
  sarif-path:
    description: Path to the generated SARIF file, if sarif-output was set.

runs:
  using: node24
  main: dist/index.js
