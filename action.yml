name: CodeCharter
description: Analyze .NET code quality and annotate pull requests with violations
author: bochmann-software

branding:
  icon: shield
  color: blue

inputs:
  mode:
    description: |
      What this step runs. `analyze` (the default) runs the rule analysis and is
      configured by the inputs below it. `coverage` runs the test-coverage gate
      instead: it executes your test projects with coverage collection and fails
      when line coverage is below the configured minimum. The coverage inputs are
      grouped at the end of this list and are ignored in `analyze` mode.
    required: false
    default: analyze
  solution:
    description: |
      Path to the .sln, .slnx, or .csproj file, relative to the repository root.
      Leave empty to auto-discover: the action picks the first .sln/.slnx it finds
      (shallowest directory first, then alphabetical), or the first .csproj when no
      solution file exists. Set this explicitly when the repository has several.
    required: false
    default: ''
  api-key:
    description: |
      Your CodeCharter portal API key. Generate one at
      https://codecharter.tools/api-keys and store as a
      repository or organization secret named CODECHARTER_API_KEY.
    required: true
  rules:
    description: |
      Path to a local rules directory in your repository (e.g. rules), passed to
      the CLI as `--rules`. With a CLI >= 1.6.4 this ADDS to whatever the CLI
      already resolves from `.codecharter/config.yml` (`profiles:` and `rules:`)
      instead of replacing it; a later source wins on a duplicate rule id, and
      the CLI reports the shadowing. Set `rules-only: true` to restore the old
      exclusive behavior. Leave `rules` empty to let the CLI resolve rules
      itself from `.codecharter/config.yml` alone.
    required: false
    default: ''
  rules-only:
    description: |
      Passed to the CLI as `--rules-only`. Restricts the run to the `rules`
      input's directories only, ignoring `profiles:` and `rules:` declared in
      `.codecharter/config.yml` — the exclusive behavior `rules` had before CLI
      1.6.4. Requires `rules` to be set; the step fails fast with an actionable
      message otherwise (the CLI itself would exit 2, "inconclusive", for the
      same reason, but only after the download and the run). Requires a CLI
      with additive rules (`version: latest`, the default, satisfies it; pin
      >= 1.6.4 explicitly otherwise).
    required: false
    default: 'false'
  require-rules:
    description: |
      Fail the run instead of silently proceeding when no rule source resolves
      at all: no `rules` input, no `rules/` directory in the repository root,
      and no `profiles:` or `rules:` declared in `.codecharter/config.yml`.
      Leave 'false' (default) to only warn in that case. This is a pre-flight
      check the action makes before invoking the CLI, so it fails fast without
      spending the download/run — it does not overlap with a CLI >= 1.6.4's own
      exit code 2 ("inconclusive"), which instead catches a declared source that
      ultimately failed to resolve (e.g. a profile the portal could not serve),
      something this pre-flight check cannot see ahead of time. Both can fire
      independently; neither is a duplicate of the other. With CLI < 1.6.4 (no
      bundled-samples fallback removal yet) this also covers the silent
      fallback to the CLI's bundled sample rules.
    required: false
    default: 'false'
  fail-on:
    description: Exit with a failure when any violation reaches this level (error | warn | info | never).
    required: false
    default: 'error'
  severity-threshold:
    description: Minimum severity to report and annotate (error | warn | info).
    required: false
    default: 'info'
  diff:
    description: |
      Scope the run to only changed lines. One input, interpreted by value:
        - 'false' (default) — analyze the whole solution.
        - 'true' — the lines changed by the triggering event. On pull requests,
          the base branch against the head (merge-base..head). On pushes, the
          merge-base of `before` and sha against sha, so a force push does not
          count the commits it dropped (needs fetch-depth: 0). When `before` is
          empty or all zeros (a new branch), or, with a warning, not in the
          checkout or without a merge-base with sha (rewritten history, or a
          shallow checkout), the pushed commit against its parent (sha~1..sha).
          If that parent is missing too (a root commit, or a depth-1 checkout)
          and on any other event type the run falls back to the whole solution
          with a warning. In coverage mode a pull request whose merge-base is
          not in the checkout fails the step before any test runs (use
          fetch-depth: 0); analyze mode then diffs the base tip directly.
        - a git ref range, e.g. 'main..HEAD' or 'origin/main..HEAD'.
        - a path to a unified diff file in the repository (analyze mode only).
      In analyze mode both the reported findings and the fail-on gate apply only
      to changed lines. In coverage mode the gate applies to the changed lines
      (see `min-diff-coverage`) and whole-solution coverage is only reported.
      Check out enough history (actions/checkout with fetch-depth: 0) for the
      compared commits to be reachable.
    required: false
    default: 'false'
  baseline:
    description: |
      Path to a baseline file (relative to the repo root, or absolute) recording
      accepted findings. When set, both the reported findings and the fail-on gate
      apply only to findings NOT in the baseline, so existing findings are tolerated
      and only new ones fail the build. Generate the file with the CLI's
      `--write-baseline` and commit it. A missing file analyzes everything (with a
      warning); a corrupt file fails the run. Composes with `diff`. Requires a CLI
      with baseline support (`version: latest`, the default, satisfies it).
    required: false
    default: ''
  telemetry:
    description: |
      Opt-in telemetry. When 'true', the run sends one anonymous usage event
      (tool name, latency bucket, per-rule finding counts, hashed workspace id) to
      the CodeCharter endpoint, authenticated with the short-lived license the CLI
      already mints from `api-key`. Off by default; no source, file paths, or code
      are ever sent. Requires a CLI with telemetry support (`version: latest`, the
      default, satisfies it).
    required: false
    default: 'false'
  badge:
    description: |
      Opt-in; only with `badge: true` are coverage/finding numbers attached to the
      authenticated check report so the portal can serve repository badges;
      nothing is stored otherwise. The attached numbers are aggregates only
      (coverage percent and line totals, finding counts by severity, test counts)
      plus the branch they were measured on. Valid in both modes; enable the badge
      for the repository in the portal to get the badge URL.
    required: false
    default: 'false'
  version:
    description: |
      CodeCharter CLI version selector. Use 'latest' (recommended), 'v1',
      'v1.4', or an exact pin like 'v1.4.2'.
    required: false
    default: 'latest'
  portal-base-url:
    description: |
      CodeCharter portal base URL. Override only if pointing at a self-hosted
      portal or staging environment.
    required: false
    default: 'https://codecharter.tools'
  comment:
    description: |
      Post (and update) a sticky summary comment on the pull request. Requires
      `permissions: pull-requests: write`. Set to 'false' to rely on inline
      annotations only.
    required: false
    default: 'true'
  cache:
    description: |
      Cache the downloaded CLI binary between runs (via the Actions cache) to
      skip re-downloading it each run. Set to 'false' to always download.
    required: false
    default: 'true'
  comment-key:
    description: |
      Discriminator for the sticky PR comment. Leave empty to derive it from the
      workflow, job, and solution (so multiple CodeCharter steps in one PR each keep
      their own comment). Set an explicit value to control which runs share a
      comment (e.g. a matrix dimension) or to merge several into one.
    required: false
    default: ''
  sarif-output:
    description: |
      If set, additionally write a SARIF v2.1 file to this path (relative to the
      repository root) for upload to GitHub Code Scanning. Leave empty to skip.
    required: false
    default: ''
  github-token:
    description: Token used to post the PR comment. Defaults to the workflow token.
    required: false
    default: ${{ github.token }}

  coverage-root:
    description: |
      Coverage mode only. Directory tree searched for test projects, relative to
      the repository root. Defaults to the repository root.
    required: false
    default: ''
  min-coverage:
    description: |
      Coverage mode only. Minimum required line-coverage percent (0-100), written
      locale-independently (e.g. `99.5`). Overrides `coverage.minimum-percent` in
      `.codecharter/config.yml` for this run; leave empty to use the repo config.
    required: false
    default: ''
  min-diff-coverage:
    description: |
      Coverage mode only. Minimum required coverage of the changed lines (0-100),
      written locale-independently (e.g. `100` or `99.5`). Needs `diff`: with
      `diff: true` or a git ref range the step gates the lines that range
      changed, and that gate alone decides the result; whole-solution coverage
      is then only reported. Leave empty to apply the effective `min-coverage`
      to the changed lines. Setting it while `diff` is off fails the step; on an
      event where `diff: true` finds no range it is ignored with a warning.
      Requires a CLI with changed-line coverage (`version: latest` satisfies it).
    required: false
    default: ''
  skip-tests:
    description: |
      Coverage mode only. When `true`, do not run the tests; analyze the coverage
      files already present under the results root. Use this when a previous step
      in the same job already ran `dotnet test` with coverage collection.
    required: false
    default: 'false'
  results-root:
    description: |
      Coverage mode only. Directory for test and coverage artifacts, relative to
      the repository root. Defaults to the CLI's own location under the coverage root.
    required: false
    default: ''
  fail-on-threshold:
    description: |
      Coverage mode only. When `false`, coverage below the minimum is reported but
      does not fail the step; with a changed-lines gate (`diff`) this applies to
      that gate. Failing tests, missing coverage data and configuration errors
      still fail regardless of this input.
    required: false
    default: 'true'
  coverage-report:
    description: |
      Coverage mode only. Path (relative to the repository root) to write the JSON
      coverage report to, so later steps can upload or post-process it. Leave empty
      to keep the report in a temp directory that is removed when the step ends.
    required: false
    default: ''

outputs:
  coverage-percent:
    description: Line-coverage percent from the coverage run; empty when no coverage data was produced.
  coverage-met:
    description: |
      "true" when whole-solution coverage met the required minimum. Under a
      changed-lines gate this is only reported; `diff-coverage-met` decides.
  coverage-uncovered-regions:
    description: Number of uncovered regions in the coverage report.
  diff-coverage-percent:
    description: |
      Coverage percent of the changed lines. Empty when no changed-lines gate
      ran, and when the range changed no measurable line.
  diff-coverage-met:
    description: '"true" when the changed lines met the required minimum; empty when no changed-lines gate ran.'
  diff-coverage-changed-lines:
    description: Number of measurable changed lines the gate checked (0 is a pass over nothing); empty when no gate ran.
  diff-coverage-covered-lines:
    description: Number of those changed lines that are covered; empty when no changed-lines gate ran.
  diff-coverage-uncovered-regions:
    description: Number of uncovered changed regions in the report; empty when no changed-lines gate ran.
  coverage-report-path:
    description: Path to the JSON coverage report, if coverage-report was set.
  findings-total:
    description: Total number of findings.
  findings-error:
    description: Number of error-level findings.
  findings-warn:
    description: Number of warning-level findings.
  findings-info:
    description: Number of info-level findings.
  sarif-path:
    description: Path to the generated SARIF file, if sarif-output was set.

runs:
  using: node24
  main: dist/index.js
